[package]
name = "binance-feed"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
dpdk-smoltcp = { path = "../dpdk-smoltcp" }
tap-echo = { path = "../tap-echo" }
stack-stream = { path = "../stack-stream" }
tungstenite = "=0.30.0"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "=1.0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
zhida-test-kit = { path = "../../test-support/kit" }
zhida-test-support = { path = "../../test-support" }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
zhida-buffer = { path = "../zhida-buffer" }
zhida-dpdk-sys = { path = "../zhida-dpdk-sys" }
